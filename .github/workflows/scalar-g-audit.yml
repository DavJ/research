name: Scalar G audit

on:
  push:
    paths:
      - "audits/scalar_g/**"
      - "theory-of-everything/latex/**"
      - "FTL-problem/pauli12.wxm"
      - ".github/workflows/scalar-g-audit.yml"
  pull_request:
    paths:
      - "audits/scalar_g/**"
      - "theory-of-everything/latex/**"
      - "FTL-problem/pauli12.wxm"
      - ".github/workflows/scalar-g-audit.yml"

permissions:
  contents: read

jobs:
  symbolic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audits/scalar_g/requirements.txt
      - run: python -m pip install -r audits/scalar_g/requirements.txt
      - run: python -B audits/scalar_g/audit_checks.py -v
